<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnuggleUp - Make Admin</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
            font-size: 28px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        .info-box {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
        }
        .info-box p {
            margin: 0 0 8px 0;
            color: #555;
            font-size: 14px;
        }
        .info-box p:last-child {
            margin-bottom: 0;
        }
        .code {
            background: #2c3e50;
            color: #00ff00;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Make Admin</h1>
        <p class="subtitle">Grant admin access to your SnuggleUp account</p>

        <div class="info-box">
            <p><strong>Instructions:</strong></p>
            <p>1. Enter your registered email address</p>
            <p>2. Use the secret key: <span class="code">snuggleup-admin-setup-2025</span></p>
            <p>3. Click "Make Me Admin"</p>
            <p>4. Login to see the admin dashboard</p>
        </div>

        <form id="adminForm">
            <div class="form-group">
                <label>Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    value="support@snuggleup.co.za"
                    required 
                    placeholder="your-email@example.com"
                />
            </div>

            <div class="form-group">
                <label>Secret Key</label>
                <input 
                    type="text" 
                    id="secret" 
                    value="snuggleup-admin-setup-2025"
                    required 
                    placeholder="Enter secret key"
                />
            </div>

            <button type="submit" id="submitBtn">
                🚀 Make Me Admin
            </button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'https://snuggleup-backend.onrender.com'; // Change if needed

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const secret = document.getElementById('secret').value;
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/setup/make-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, secret }),
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <strong>✅ Success!</strong><br>
                        ${data.message}<br><br>
                        <strong>User:</strong> ${data.user.email}<br>
                        <strong>Name:</strong> ${data.user.name}<br>
                        <strong>Admin Status:</strong> ${data.user.is_admin ? '✓ Admin' : 'Not Admin'}<br><br>
                        <strong>Next Steps:</strong><br>
                        1. Go to your SnuggleUp store<br>
                        2. Login with your credentials<br>
                        3. Look for the 🛡️ Admin button in the header<br>
                        4. Start managing your store!
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <strong>❌ Error</strong><br>
                        ${data.error || 'Failed to make admin'}<br><br>
                        ${data.error === 'User not found. Please register first.' 
                            ? 'Please register an account at your store first, then try again.' 
                            : 'Check the secret key and try again.'}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <strong>❌ Network Error</strong><br>
                    ${error.message}<br><br>
                    Make sure the backend is deployed and running.
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Make Me Admin';
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
